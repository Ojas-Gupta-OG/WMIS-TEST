<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Examination Workspace | Welfare Mission International School</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/test.css">
</head>
<body class="test-page">

  <!-- Interactive 3D Physics Mesh Background -->
  <canvas id="particleCanvas" aria-hidden="true"></canvas>

  <header class="test-header">
    <div class="test-brand">
      <img src="assets/School-logo.jpg" alt="School Logo">
      <span id="title">Loading assessment…</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 13.5px; font-weight: 700; color: var(--ink-muted);">Time Remaining:</span>
      <b id="timer" class="timer-pill">--:--</b>
    </div>
  </header>

  <main class="test-main">
    <div class="test-layout">
      <section class="card question-card">
        <p class="student-line" id="student"></p>
        <p class="question-count" id="count"></p>
        <h2 id="question"></h2>
        <div id="options"></div>

        <div class="actions">
          <button class="secondary" id="prev" type="button">← Previous</button>
          <button id="next" type="button">Next →</button>
          <button class="danger" id="submit" type="button">Submit Assessment</button>
        </div>
      </section>

      <aside class="card question-nav">
        <h3>Question Navigator</h3>
        <p class="muted" style="font-size: 13px; line-height: 1.4; margin-top: 4px;">Answered questions update automatically.</p>
        <div id="palette" class="palette"></div>
      </aside>
    </div>
  </main>

  <script src="js/bg-3d.js"></script>
  <script type="module" src="js/test.js"></script>
</body>
</html>
