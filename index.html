  <!-- Interactive Google Antigravity 3D Particle Vortex -->

  <!-- Clean Top Navigation -->
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Home">
      <img
        src="assets/School-logo.jpg"
        alt="School Logo"
        width="40"
